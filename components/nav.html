<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unitringle Landing Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9f9f9;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 5%;
      background: #2b2a28; /* Dark background from logo */
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      position: relative;
    }

    .navbar-left img {
      height: 80px;
      width: 100%;
      
      transition: transform 0.3s ease;
    }

    .navbar-left img:hover {
      transform: scale(1.05);
    }

    /* Phone number styling with gold accent */
    .navbar-center {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
      color: #e2c679; /* Gold text from logo */
      padding: 10px 25px;
      border-radius: 50px;
      background-color: rgba(226, 198, 121, 0.1); /* Light gold tint */
      border: 1px solid rgba(226, 198, 121, 0.3);
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      animation: colorPulse 2.5s infinite ease-in-out;
    }

    /* Updated animation with gold theme */
    @keyframes colorPulse {
      0%, 100% {
        color: #e2c679;
        text-shadow: none;
        border-color: rgba(226, 198, 121, 0.3);
        transform: scale(1);
      }
      50% {
        color: #fff;
        text-shadow: 0 0 10px rgba(226, 198, 121, 0.5);
        border-color: rgba(226, 198, 121, 0.6);
        transform: scale(1.15);
      }
    }

    /* Enquiry button with gradient gold */
    .navbar-right a {
      background: linear-gradient(to right, #e2c679, #e4c17b); /* Gold gradient from logo */
      padding: 12px 28px;
      border-radius: 30px;
      color: #2b2a28; /* Dark text for contrast */
      text-decoration: none;
      font-weight: 700;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(226, 198, 121, 0.4);
      border: none;
      position: relative;
      overflow: hidden;
    }

    .navbar-right a:hover {
      box-shadow: 0 6px 20px rgba(226, 198, 121, 0.6);
      transform: translateY(-3px);
      background: linear-gradient(to right, #e8cf8a, #e7c985);
    }

    .navbar-right a::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }

    .navbar-right a:hover::before {
      left: 100%;
    }

    .navbar-right a::after {
      content: "➜";
      margin-left: 10px;
      transition: transform 0.3s ease;
    }

    .navbar-right a:hover::after {
      transform: translateX(4px);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .navbar {
        padding: 15px 5%;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: space-between;
      }

      .navbar-left {
        order: 1;
      }
      
      .navbar-right {
        order: 2;
      }
      
      .navbar-center {
        order: 3;
        flex: 1 1 100%;
        justify-content: center;
        padding: 12px 20px;
        font-size: 16px;
        margin-top: 10px;
      }

      .navbar-left img {
        height: 50px;
      }

      .navbar-right a {
        padding: 10px 18px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
        .navbar-center {
            font-size: 15px;
            gap: 8px;
        }

        .navbar-right a {
            padding: 9px 15px;
            font-size: 13px;
        }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-left">
      <img src="images\cropped-Alchemy-Logo.png.webp" alt="" />
    </div>
    <div class="navbar-center">
      <span>📞</span>
      <span>+91 9124101999</span>
    </div>
    <div class="navbar-right">
      <a href="#pup" class="premium-cta-button" onclick="showPopup()">Enquiry Now</a>
    </div>
  </nav>

</body>
</html>
