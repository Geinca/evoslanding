<!DOCTYPE html>
<html>
<head>
    <title>Footer with New Colors</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .footer {
            /* Changed background and border color */
            background-color: #2b2a28; 
            width: 100%;
            height: auto;
            padding: 25px 0;
            text-align: center;
            /* Using a more premium font */
            font-family: 'Montserrat', sans-serif; 
            border-top: 1px solid #7a7a7a; 
        }
        
        .copyright {
            font-size: 13px;
            /* Changed text color */
            color: #a5a5a5; 
            margin-bottom: 15px;
        }
        
        .social-links {
            margin-bottom: 15px;
        }
        
        .social-links a {
            margin: 0 8px;
            /* Changed icon color */
            color: #a5a5a5; 
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            /* Gold color on hover */
            color: #e2c679; 
        }
        
        .contact-info {
            font-size: 12px;
            /* Changed text color */
            color: #a5a5a5; 
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="footer">
        <div class="copyright">
            &copy; 2025  EVOS ALCHEMY. All rights reserved.
        </div>
        
        <div class="social-links">
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>
        
        <div class="contact-info">
            Phone:+91 9124101999<br>
            Email: enquiry@evosalchemy.com | https://evosalchemy.com/<br>
          Raghunathpur, Nandankanan Road, Bhubaneswar, Odisha 751024 <br>
          Designed By Geinca
        </div>
    </div>
</body>
</html>
