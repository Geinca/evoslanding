<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Properties Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
    }
    
    .showcase-section {
      max-width: 1800px;
      margin: 0 auto;
      padding: 80px 20px;
      position: relative;
      overflow: hidden;
    }
    
    .section-header {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
      z-index: 2;
    }
    
    .gold-badge {
      display: inline-block;
      background-color: rgba(226, 198, 121, 0.15);
      color: #e2c679;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 10px 25px;
      border-radius: 50px;
      margin-bottom: 20px;
      text-transform: uppercase;
      border: 1px solid rgba(226, 198, 121, 0.3);
    }
    
    .section-title {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
      line-height: 1.2;
    }
    
    .section-title span {
      color: #e2c679;
      position: relative;
    }
    
    .section-title span::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(to right, #e2c679, #e4c17b);
    }
    
    .section-subtitle {
      color: #a5a5a5;
      font-size: 1.1rem;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.8;
    }
    
    /* Gallery Grid */
    .property-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      position: relative;
      z-index: 1;
    }
    
    @media (min-width: 1600px) {
      .property-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    
    .property-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      height: 350px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .property-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(226, 198, 121, 0.15);
    }
    
    .property-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .property-card:hover .property-image {
      transform: scale(1.05);
    }
    
    .property-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    
    .property-card:hover .property-overlay {
      opacity: 1;
    }
    
    .property-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #fff;
    }
    
    .property-location {
      color: #e2c679;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .property-features {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.85rem;
      color: #a5a5a5;
    }
    
    .feature i {
      color: #e2c679;
      font-size: 0.9rem;
    }
    
    /* View More Button */
    .view-more {
      text-align: center;
      margin-top: 60px;
    }
    
    .view-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(to right, #e2c679, #e4c17b);
      color: #2b2a28;
      font-weight: 600;
      padding: 16px 40px;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(226, 198, 121, 0.3);
      border: none;
      cursor: pointer;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
    }
    
    .view-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: 0.5s;
    }
    
    .view-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(226, 198, 121, 0.5);
    }
    
    .view-btn:hover::before {
      left: 100%;
    }
    
    /* Decorative Elements */
    .gold-dots {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(226,198,121,0.1) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }
    
    .dots-1 {
      top: 10%;
      left: 5%;
    }
    
    .dots-2 {
      bottom: 10%;
      right: 5%;
    }
    
    /* Responsive Adjustments */
    @media (max-width: 1024px) {
      .property-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
      
      .property-card {
        height: 320px;
      }
    }
    
    @media (max-width: 768px) {
      .showcase-section {
        padding: 60px 15px;
      }
      
      .section-title {
        font-size: 2.2rem;
      }
      
      .section-subtitle {
        font-size: 1rem;
      }
      
      .property-grid {
        gap: 15px;
      }
      
      .property-card {
        height: 280px;
      }
      
      .property-overlay {
        padding: 20px;
      }
      
      .property-name {
        font-size: 1.3rem;
      }
    }
    
    @media (max-width: 480px) {
      .gold-badge {
        font-size: 12px;
        padding: 8px 15px;
      }
      
      .section-title {
        font-size: 1.8rem;
      }
      
      .property-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
